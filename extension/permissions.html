<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoatMeet recording access</title><link rel="stylesheet" href="recorder.css"><script type="module" src="permissions.mjs"></script>
<body><main>
  <h1>Allow access and record</h1>
  <p>Approve folder and microphone access here. GoatMeet then starts recording your original tab automatically.</p>
  <p id="folder"></p>
  <p id="microphone"></p>
  <p id="status" role="status" aria-live="polite">Checking access…</p>
  <div class="actions">
    <button id="allow" disabled>Allow and record</button>
    <button id="permissions" class="secondary" hidden>Chrome microphone settings</button>
    <button id="close" class="secondary">Cancel</button>
  </div>
</main></body></html>

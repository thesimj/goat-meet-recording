name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  package:
    name: Build store package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run package
      - name: Verify the archive with a second unpacker
        run: |
          set -e
          zip=$(ls dist/goatmeet-*.zip)
          unzip -t "$zip"
          unzip -l "$zip" | grep -q ' manifest.json$'
      - uses: actions/upload-artifact@v4
        with:
          name: goatmeet-extension
          path: dist/goatmeet-*.zip
          if-no-files-found: error

  release:
    name: Attach package to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: goatmeet-extension
          path: dist
      - name: Check that the tag matches the manifest version
        run: |
          set -e
          version=$(node -p "require('./extension/manifest.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match manifest version $version"; exit 1; }
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "GoatMeet ${GITHUB_REF_NAME}" --notes-from-tag
          gh release upload "${GITHUB_REF_NAME}" dist/goatmeet-*.zip --clobber
